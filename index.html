<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-bg"></div>

  <main class="app-container">
    <header class="app-header">
      <div class="logo-badge">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span>Cloudflare Edition</span>
      </div>
      <h1>YouTube to MP3 Downloader</h1>
      <p class="subtitle">Download single YouTube videos or entire playlists directly to high quality MP3</p>
    </header>

    <section class="card input-card">
      <div class="input-wrapper">
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <input type="url" id="urlInput" placeholder="Paste YouTube video or playlist URL..." autocomplete="off">
        <button id="convertBtn" class="btn primary-btn">
          <span class="btn-text">Extract MP3</span>
          <div class="spinner hidden"></div>
        </button>
      </div>

      <div class="options-row">
        <div class="option-group">
          <label>Audio Quality</label>
          <select id="qualitySelect">
            <option value="320">320 kbps (High Quality)</option>
            <option value="256">256 kbps (Medium)</option>
            <option value="128">128 kbps (Standard)</option>
          </select>
        </div>
      </div>
      
      <div id="statusAlert" class="alert hidden"></div>
    </section>

    <!-- Results Section -->
    <section id="resultsSection" class="results-section hidden">
      <h2 class="section-title">Ready Downloads</h2>
      <div id="downloadList" class="download-list"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Powered by Cloudflare Pages • Free & Open Source</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
